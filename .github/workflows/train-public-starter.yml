name: Train SANKET public starter model

on:
  push:
    branches: [main]
    paths:
      - "ml/training/bootstrap_public.py"
      - "ml/training/dataset.py"
      - "ml/training/train_template.py"
      - "apps/api/app/services/temporal_model.py"
      - "apps/api/requirements-public-train.txt"
      - "scripts/install_holistic_task.py"
      - ".github/workflows/train-public-starter.yml"

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install vision and training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements-dev.txt
          python -m pip install -r apps/api/requirements-vision.txt
          python -m pip install -r apps/api/requirements-public-train.txt

      - name: Download official Holistic task asset
        run: python scripts/install_holistic_task.py

      - name: Train SANKET public isolated-sign starter
        run: |
          python -m ml.training.bootstrap_public --classes 6 --max-per-class 12 --min-per-class 8

      - name: Verify trained artifact has useful selective performance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from apps.api.app.services.temporal_model import TemporalTemplateModel
          root=Path("ml/artifacts/demo-v1")
          m=TemporalTemplateModel(root)
          assert m.loaded, m.load_error
          report=json.loads((root/"evaluation.json").read_text())
          test=report["test"]
          assert len(m.labels) >= 5, m.labels
          assert test["coverage"] >= 0.30, test
          print("model",m.version)
          print("labels",m.labels)
          print("top1",test["top1_accuracy"])
          print("accepted_accuracy",test["accepted_accuracy"])
          print("coverage",test["coverage"])
          PY

      - name: Commit derived model artifact
        run: |
          git config user.name "SANKET AI Trainer"
          git config user.email "actions@users.noreply.github.com"
          git add -f ml/artifacts/demo-v1/model.npz
          git add -f ml/artifacts/demo-v1/manifest.json
          git add -f ml/artifacts/demo-v1/evaluation.json
          git add -f ml/artifacts/demo-v1/MODEL_CARD.md
          if git diff --cached --quiet; then
            echo "No artifact changes to commit."
          else
            git commit -m "model: strengthen SANKET public starter vocabulary [skip ci]"
            git push origin HEAD:main
          fi
