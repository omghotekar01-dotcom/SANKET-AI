name: Train ISL500 reliable specialist

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/triggers/isl500-specialist-v1.txt"

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install MediaPipe extraction stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements-dev.txt
          python -m pip install -r apps/api/requirements-vision.txt
          python -m pip install -r apps/api/requirements-public-train.txt

      - name: Extract 9 signs from 15-signer ISL500 data
        run: python -m ml.training.isl500_specialist_extract --max-per-class 15

      - name: Install isolated neural training backend
        run: python -m pip install tensorflow==2.20.0

      - name: Train TCN BiGRU and Conv-GRU candidates
        run: python -m ml.training.isl500_specialist_neural

      - name: Enforce 3-signer held-out quality gate
        run: python -m ml.training.isl500_specialist_neural_gate

      - name: Commit only passing neural artifact
        run: |
          git config user.name "SANKET AI Trainer"
          git config user.email "actions@users.noreply.github.com"
          git add -f ml/artifacts/isl500-specialist-v1/model.keras
          git add -f ml/artifacts/isl500-specialist-v1/normalization.npz
          git add -f ml/artifacts/isl500-specialist-v1/manifest.json
          git add -f ml/artifacts/isl500-specialist-v1/evaluation.json
          git add -f ml/artifacts/isl500-specialist-v1/MODEL_CARD.md
          git commit -m "model: add signer-disjoint ISL500 neural specialist"
          git pull --rebase origin main
          git push origin HEAD:main
