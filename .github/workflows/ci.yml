name: SANKET AI CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend and vision runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements-dev.txt
          python -m pip install -r apps/api/requirements-vision.txt
      - name: Compile Python
        run: python -m compileall -q apps ml scripts
      - name: Run backend and ML tests
        run: python -m pytest apps/api/tests -q

  bootstrap-recognizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned recognition stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements-dev.txt
          python -m pip install -r apps/api/requirements-vision.txt
          python -m pip install -r apps/api/requirements-bootstrap.txt
      - name: Download verified bootstrap assets
        run: python scripts/install_bootstrap.py
      - name: Process a real frame and load the 50-word recognizer
        run: python scripts/smoke_live_runtime.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package.json
      - name: Install frontend dependencies
        run: npm install
      - name: Typecheck and production build
        run: npm run build


  windows-runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install exact Windows runtime
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements-dev.txt
          python -m pip install -r apps/api/requirements-vision.txt
          python -m pip install -r apps/api/requirements-bootstrap.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.5,<3"
          python -m pip install -r apps/api/requirements-openhands.txt
      - name: Download verified fallback model
        run: python scripts/install_bootstrap.py
      - name: Download and convert official OpenHands INCLUDE model
        run: python scripts/install_openhands.py
      - name: Process real JPEG and run fallback inference on Windows
        run: python scripts/smoke_live_runtime.py
      - name: Run official OpenHands SL-GCN inference on Windows
        run: python scripts/smoke_openhands_runtime.py
      - name: Verify integrated Windows model selection
        run: |
          python -c "from apps.api.app.runtime import model, perception; assert perception.available, perception.reason; assert model.loaded, model.load_error; assert model.backend == 'ai4bharat_include_slgcn_pytorch', (model.backend, model.selection_reason); assert len(model.labels) == 263; print('Windows integrated model:', model.backend, model.version)"

  openhands-recognizer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SANKET vision and OpenHands CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements-dev.txt
          python -m pip install -r apps/api/requirements-vision.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.5,<3"
          python -m pip install -r apps/api/requirements-openhands.txt
      - name: Install official AI4Bharat INCLUDE SL-GCN
        run: python scripts/install_openhands.py
      - name: Run full SL-GCN forward pass
        run: python scripts/smoke_openhands_runtime.py
