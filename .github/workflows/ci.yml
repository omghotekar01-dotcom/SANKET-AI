name: SANKET AI CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend and vision runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements-dev.txt
          python -m pip install -r apps/api/requirements-vision.txt
      - name: Compile Python
        run: python -m compileall -q apps ml scripts
      - name: Run backend and ML tests
        run: python -m pytest apps/api/tests -q

  bootstrap-recognizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned recognition stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements-dev.txt
          python -m pip install -r apps/api/requirements-vision.txt
          python -m pip install -r apps/api/requirements-bootstrap.txt
      - name: Download verified bootstrap assets
        run: python scripts/install_bootstrap.py
      - name: Process a real frame and load the 50-word recognizer
        run: python scripts/smoke_live_runtime.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package.json
      - name: Install frontend dependencies
        run: npm install
      - name: Typecheck and production build
        run: npm run build


  windows-runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install exact Windows runtime
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements-dev.txt
          python -m pip install -r apps/api/requirements-vision.txt
          python -m pip install -r apps/api/requirements-bootstrap.txt
      - name: Download verified 50-word model
        run: python scripts/install_bootstrap.py
      - name: Process real JPEG and run model inference on Windows
        run: python scripts/smoke_live_runtime.py
