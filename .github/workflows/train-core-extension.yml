name: Train SANKET core extension

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/triggers/core-extension-v1.txt"

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install extraction stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements-dev.txt
          python -m pip install -r apps/api/requirements-vision.txt
          python -m pip install -r apps/api/requirements-public-train.txt
      - name: Extract deterministic MediaPipe sequences
        run: python -m ml.training.core_extension_extract --max-per-class 18 --min-per-class 8
      - name: Install isolated TensorFlow training backend
        run: |
          python -m pip install tensorflow==2.20.0
      - name: Train deterministic five-sign BiLSTM
        run: python -m ml.training.core_extension_train
      - name: Enforce measured quality gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("ml/artifacts/core-extension-v1/evaluation.json").read_text())
          test=report["test"]
          assert test["samples"] >= 10, test
          assert test["top1_accuracy"] >= 0.55, test
          assert test["macro_f1"] >= 0.50, test
          assert test["accepted_accuracy"] >= 0.75, test
          assert test["coverage"] >= 0.40, test
          print("quality gate passed", test)
          PY
      - name: Commit quality-gated artifact
        run: |
          git config user.name "SANKET AI Trainer"
          git config user.email "actions@users.noreply.github.com"
          git add -f ml/artifacts/core-extension-v1/model.keras
          git add -f ml/artifacts/core-extension-v1/normalization.npz
          git add -f ml/artifacts/core-extension-v1/manifest.json
          git add -f ml/artifacts/core-extension-v1/evaluation.json
          git add -f ml/artifacts/core-extension-v1/MODEL_CARD.md
          git commit -m "model: add five-sign BiLSTM core extension"
          git pull --rebase origin main
          git push origin HEAD:main
